<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajedrez</title>

<!-- NUEVO: tipografías de Google Fonts (Quicksand, Nunito, DM Mono).
     Se usan como variables en :root del CSS (--font-heading/--font-body/--font-mono) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- NUEVO: iconos de Google Fonts (Material Symbols Outlined) para reemplazar los glifos de texto ☾/⇅ -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300,0,0">

<!-- MODIFICADO: ahora vive en la carpeta css/ -->
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ajedrez</h1>
    <!-- MODIFICADO: el reloj ahora vive en el header, junto al título, para
         no sumar una fila extra arriba del tablero (pensado para que la
         página entre entera en pantallas bajas, como las netbooks
         educativas de 1366x768). Se oculta solo si no hay reloj configurado. -->
    <div class="clocks" id="clocks" hidden>
      <div class="clock-chip" id="clockBlack" data-color="b">
        <span class="row-label">Negras</span>
        <span class="clock-time" id="clockBlackTime">05:00</span>
      </div>
      <div class="clock-chip" id="clockWhite" data-color="w">
        <span class="row-label">Blancas</span>
        <span class="clock-time" id="clockWhiteTime">05:00</span>
      </div>
    </div>
    <!-- El botón de girar tablero se eliminó: ahora el giro es automático según
         de quién es el turno (ver script.js: setOrientationForTurn) -->
    <div class="header-controls">
      <button id="soundBtn" class="icon-btn" type="button" title="Silenciar sonido" aria-label="Silenciar sonido">
        <span class="material-symbols-outlined" aria-hidden="true">volume_up</span>
      </button>
      <!-- NUEVO: abre el diálogo para elegir (o quitar) el reloj de ajedrez -->
      <button id="clockSettingsBtn" class="icon-btn" type="button" title="Configurar reloj" aria-label="Configurar reloj">
        <span class="material-symbols-outlined" aria-hidden="true">timer</span>
      </button>
      <button id="themeBtn" class="icon-btn" type="button" title="Cambiar tema" aria-label="Cambiar tema">
        <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
      </button>
    </div>
  </header>

  <!-- MODIFICADO: sólo el estado y el tablero quedan en la columna
       principal; el reloj se movió al header y los controles de partida al
       panel lateral, así el tablero no compite con ellos por altura. -->
  <div class="board-area">
    <div class="status" id="status">Jugador 1 · Blancas</div>
    <!-- NUEVO: aviso corto y temporal (ej. "ese movimiento deja tu rey en jaque") -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- .board-stage: contenedor con perspectiva 3D para la animación de giro del tablero -->
    <div class="board-stage">
      <div class="board" id="board"></div>
      <!-- NUEVO: flecha que marca de dónde a dónde fue la última jugada
           (se dibuja/actualiza en script.js: updateLastMoveArrow) -->
      <svg class="last-move-arrow" id="lastMoveArrow" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <aside>
    <section class="panel">
      <h2>Capturas</h2>
      <div class="captured-row">
        <span class="row-label">Blancas</span>
        <div id="capByWhite" class="captured-pieces"></div>
        <!-- NUEVO: diferencia de material a favor (ver script.js: renderCaptured) -->
        <span class="material-diff" id="capWhiteDiff"></span>
      </div>
      <div class="captured-row">
        <span class="row-label">Negras</span>
        <div id="capByBlack" class="captured-pieces"></div>
        <span class="material-diff" id="capBlackDiff"></span>
      </div>
    </section>
    <section class="panel">
      <h2>Movimientos</h2>
      <ol id="moveList"></ol>
    </section>
    <!-- NUEVO: controles de la partida, reubicados acá (antes estaban
         debajo del tablero) para liberarle esa altura al tablero. -->
    <section class="panel controls-panel">
      <div class="controls-row">
        <button id="undoBtn" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">undo</span>
          Deshacer
        </button>
        <!-- NUEVO: rehacer una jugada deshecha -->
        <button id="redoBtn" type="button">
          <span class="material-symbols-outlined" aria-hidden="true">redo</span>
          Rehacer
        </button>
      </div>
      <!-- MODIFICADO: requiere 10 clicks seguidos para evitar ofrecer tablas por error -->
      <button id="drawBtn" class="btn-full" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">handshake</span>
        <span class="btn-label">Tablas</span>
      </button>
      <!-- MODIFICADO: requiere 5 clicks seguidos para evitar reiniciar por error (ver script.js: setupMultiClickButton) -->
      <button id="resetBtn" class="btn-full" type="button">
        <span class="material-symbols-outlined" aria-hidden="true">restart_alt</span>
        <span class="btn-label">Nueva partida</span>
      </button>
    </section>
  </aside>

  <!-- NUEVO: pie de página con versión y fecha. Actualizar ambos valores
       cada vez que se modifique este archivo (index.html). -->
  <footer class="app-footer">
    <span>Ajedrez</span>
    <span aria-hidden="true">·</span>
    <span>v1.4 · 18/09/2026</span>
  </footer>
</div>

<dialog id="promoDialog">
  <h3>Elegí una pieza</h3>
  <div class="promo-choices" id="promoChoices"></div>
</dialog>

<!-- NUEVO: elegir el control de tiempo (o jugar sin reloj) -->
<dialog id="clockDialog">
  <h3>Reloj de ajedrez</h3>
  <div class="clock-options" id="clockOptions">
    <button type="button" class="clock-preset" data-minutes="">Sin reloj</button>
    <button type="button" class="clock-preset" data-minutes="3" data-increment="0">3 min</button>
    <button type="button" class="clock-preset" data-minutes="5" data-increment="0">5 min</button>
    <button type="button" class="clock-preset" data-minutes="10" data-increment="0">10 min</button>
    <button type="button" class="clock-preset" data-minutes="15" data-increment="10">15 min + 10s</button>
    <button type="button" class="clock-preset" data-minutes="30" data-increment="0">30 min</button>
  </div>
</dialog>

<!-- NUEVO: diálogo de confirmación genérico (por ahora lo usa "Ofrecer tablas") -->
<dialog id="confirmDialog">
  <h3 id="confirmTitle">¿Confirmar?</h3>
  <p id="confirmMessage"></p>
  <div class="confirm-actions">
    <button id="confirmYes" type="button">Sí</button>
    <button id="confirmNo" type="button">No</button>
  </div>
</dialog>

<!-- MODIFICADO: ahora vive en la carpeta js/ -->
<script src="js/script.js"></script>
</body>
</html>
